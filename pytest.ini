[pytest]
testpaths = tests
addopts = -ra
markers =
    drama: needs DRAMA 4.1.4 and pyDRAMA (conda env drama_env); skipped automatically when the drama package is not importable
    reference: runs the full model against the committed SESAM reference flights (Step 1: eight trajectories, ~15 min; Step 2: the coupled thermal runs of tests/test_reentry_model_reference_thermal.py, ~35 min); no DRAMA needed; select with -m reference
    spheral: needs the Spheral container image (spheral_frag/container/pin.json); skipped automatically when the launcher cannot import Spheral

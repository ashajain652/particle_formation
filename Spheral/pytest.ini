[pytest]
testpaths = tests
addopts = -ra
markers =
    drama: needs DRAMA 4.1.4 and pyDRAMA (conda env drama_env); skipped automatically when the drama package is not importable; no Spheral test carries it at present
    reference: the slow SESAM reference flights of the Reentry Model project; no Spheral test carries it (kept so the shared -m "not drama and not reference" selection works here)
    spheral: needs the Spheral container image (spheral_frag/container/pin.json); skipped automatically when the launcher cannot import Spheral
    fe_flight: needs a real finite-element flight (Spheral M1 Task 10): skipped unless SPHERAL_FRAG_FE_RUN names its run directory and SPHERAL_FRAG_FE_PACKAGE the package that wrote it
